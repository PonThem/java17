plugins {
	id 'org.springframework.boot' version '3.1.6'
	id 'io.spring.dependency-management' version '1.1.3'
	id 'java'
  	id "org.sonarqube" version "5.0.0.4638"
	id 'jacoco'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
sourceCompatibility = '17'

repositories {
	mavenCentral()
}

configurations {
    all {
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
    }
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-aop'
	testImplementation('org.springframework.boot:spring-boot-starter-test')
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	implementation 'org.postgresql:postgresql:42.7.2'
	implementation 'org.springframework.boot:spring-boot-starter-batch'

    // use Springdoc OpenAPI replace springfox
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.5.0'

    implementation 'com.amazonaws:aws-java-sdk-core:1.12.769'
    implementation 'com.amazonaws:aws-java-sdk-sts:1.12.118'
	implementation 'com.amazonaws:aws-java-sdk-cognitoidp:1.12.118'
	implementation 'com.amazonaws:aws-java-sdk-s3:1.12.261'

    implementation 'org.springframework.boot:spring-boot-starter-log4j2'

    // Spring Security
    implementation 'org.springframework.boot:spring-boot-starter-security'
    // JWT library
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

    //for openapi generate code
    implementation 'org.openapitools:jackson-databind-nullable:0.2.1'
    implementation 'io.swagger.core.v3:swagger-annotations:2.2.21'

    //for lombok
    compileOnly 'org.projectlombok:lombok:1.18.22'
    annotationProcessor 'org.projectlombok:lombok:1.18.22'

    //for mybatis
    implementation("org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.2")

    //for unit test
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation("org.mybatis.spring.boot:mybatis-spring-boot-starter-test:3.0.2")
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.22'
    testCompileOnly 'org.projectlombok:lombok:1.18.22'
    testImplementation 'org.mockito:mockito-core:3.9.0'
    testImplementation 'org.assertj:assertj-core:3.19.0'
    testImplementation 'org.apache.logging.log4j:log4j-core:2.17.1'
    testImplementation 'org.apache.logging.log4j:log4j-api:2.17.1'
    testImplementation('org.springframework.boot:spring-boot-starter-test')
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.mockito:mockito-core'
    testImplementation 'org.mockito:mockito-inline:4.11.0'
    testImplementation 'org.mockito:mockito-junit-jupiter'
    testImplementation 'org.mockito:mockito-junit-jupiter:3.9.0'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.7.1'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.1'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.7.1'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.1'

    //for aspect
    implementation 'org.aspectj:aspectjweaver:1.9.7'

    //for s3
    implementation 'software.amazon.awssdk:s3:2.20.17'
    implementation 'software.amazon.awssdk:sdk-core:2.20.17'

    //for poi
    implementation 'org.apache.poi:poi:5.2.5'
	implementation 'org.apache.poi:poi-ooxml:5.2.5'

    //for prometheus
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    //for ECR CVE-2022-1471
    implementation 'org.yaml:snakeyaml:2.0'
    //for ECR CVE-2023-34053
    implementation 'org.springframework:spring-web:6.0.14'
    implementation 'org.springframework:spring-webmvc:6.0.14'
    //for ECR CVE-2023-44487
    implementation 'org.apache.tomcat.embed:tomcat-embed-core:10.1.16'
    implementation 'io.netty:netty-codec-http2:4.1.100.Final'
    //for ECR CVE-2024-21634
    // implementation 'com.amazon.ion:ion-java:1.11.0'
    //for ECR CVE-2024-26308
    // implementation 'org.apache.commons:commons-compress:1.26.0'
    // //for ECR CVE-2024-23672
    // implementation 'org.apache.tomcat.embed:tomcat-embed-websocket:10.1.19'
    // //for ECR CVE-2023-52428
    // implementation 'com.nimbusds:nimbus-jose-jwt:9.37.2'
    // //for ECR CVE-2024-22257
    // implementation 'org.springframework.security:spring-security-core:6.1.8'
}

test {
	useJUnitPlatform()
	finalizedBy jacocoTestReport
}

jacocoTestReport {
    reports {
        xml.required = true
        html.required = true
        csv.required = false
        html.outputLocation.set(layout.buildDirectory.dir("customJacocoReportDir/html"))
        xml.outputLocation.set(layout.buildDirectory.file("customJacocoReportDir/results.xml"))
        csv.outputLocation.set(layout.buildDirectory.file("customJacocoReportDir/results.csv"))
    }

   // Include only specific classes and source directories
//     classDirectories.setFrom(files(
//         fileTree(dir: 'build/classes/java/main', includes: ['com/valuelab/service/**','com/valuelab/controller/**'])
//     ))

//     sourceDirectories.setFrom(files(
//         'src/main/java'
//     ))

//     executionData.setFrom(files(
//         'build/jacoco/test.exec'
//     ))
}

task generateSwaggerDoc(type: Exec) {
    commandLine 'swagger-codegen', 'generate', '-i', 'src/main/resources/api.yaml', '-l', 'html2', '-o', 'src/main/resources/docs'
}
