server.port=8080
logging.level.com.valuelab=DEBUG

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# JDBC Driver: PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

#ValidationMessages
spring.messages.basename=messages,ValidationMessages
spring.messages.cache-duration=-1
spring.messages.encoding=UTF-8

#MyBatis
logging.level.com.valuelab.repository=DEBUG
logging.level.org.springframework=WARN
mybatis.type-aliases-package=com.valuelab.entity
mybatis.mapper-locations=classpath*:/com.valuelab.repository
mybatis.configuration.map-underscore-to-camel-case=true
# mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl


# JPA and Hibernate setting
spring.jpa.show-sql=true
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# aws cognito
cognito.clientId=${COGNITO_CLIENT_ID}
cognito.userPoolId=${COGNITO_USER_POOL_ID}
cognito.issuer.url=${COGNITO_ISSUER_URL}

# aws
cloud.aws.region.static=${AWS_REGION}

#access log with tomcat
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.directory=logs
server.tomcat.accesslog.prefix=access_log
server.tomcat.accesslog.suffix=.log
server.tomcat.accesslog.pattern=combined

# Spring Batch
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always

#for s3
s3.bucketname=${AWS_S3_BUCKET_NAME}
s3.foldername=export